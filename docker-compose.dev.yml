# Sadece altyapı servisleri – lokal geliştirme için
# Kullanım: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: kursutv
      POSTGRES_USER: kursutv_user
      POSTGRES_PASSWORD: KursuTV_Dev_2024!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kursutv_user -d kursutv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
